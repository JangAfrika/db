<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#101a2e">
  <script src="ga.js"></script>
  <script src="pwa.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
    <div class="topbar-title">
      <h1 id="userTitle">Loading user…</h1>
      <p class="muted" id="userSub"></p>
    </div>
    <div class="topbar-actions">
      <button class="secondary small" id="kpiBtn" hidden>View KPI</button>
      <button class="secondary small" id="printBtn" hidden>Print</button>
      <button class="secondary small" id="editBtn" hidden>Edit</button>
      <div class="user-chip">
        <div class="avatar" id="whoAvatar"></div>
        <div class="meta">
          <div class="n" id="whoName"></div>
          <div class="r" id="whoRole"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <p id="loadError" class="error" hidden></p>

    <section class="stat-grid" id="statGrid" hidden>
      <div class="stat-card">
        <div class="label">Status</div>
        <div class="value" id="statStatus">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Work plans</div>
        <div class="value" id="statPlans">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Daily reports</div>
        <div class="value" id="statReports">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Tickets raised</div>
        <div class="value" id="statTickets">—</div>
      </div>
    </section>

    <section class="panel" id="detailsPanel" hidden>
      <div class="panel-head">
        <h2>Account details</h2>
        <div class="row-actions" id="statusActions"></div>
      </div>
      <div class="info-grid" id="userInfoGrid"></div>
    </section>

    <section class="panel" id="projectsPanel" hidden>
      <div class="panel-head">
        <h2>Assigned projects</h2>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Project</th>
              <th>Assigned at</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="projectsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="evaluationsPanel" hidden>
      <div class="panel-head">
        <h2>Supervisor evaluations</h2>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Score</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="evaluationsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="printArea"></div>

  <script src="config.js"></script>
  <script src="dialog.js"></script>
  <script>
    const session = requireSession();
    if (typeof gaTrackRole === 'function') gaTrackRole(session.role);
    document.getElementById('whoName').textContent = session.name;
    document.getElementById('whoRole').textContent = ROLE_LABELS[session.role] || session.role;
    document.getElementById('whoAvatar').textContent = (session.name || '?').split(' ').map(function (s) {return s[0];}).join('').slice(0, 2).toUpperCase();
    document.getElementById('backLink').href = backLinkHref(session);

    const isItAdmin = session.role === 'IT_ADMIN';
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('id') || session.userId;

    const ROLE_OPTIONS = [
      {value: 'MANAGER', label: 'Manager'},
      {value: 'ADMIN_SECRETARY', label: 'Admin secretary'},
      {value: 'SITE_SUPERVISOR', label: 'Site supervisor'},
      {value: 'IT_ADMIN', label: 'IT admin'}
    ];

    let profileCache = null;

    function nice(s) {return s ? String(s).replace(/_/g, ' ') : '';}
    function cap(s) {s = nice(s); return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';}

    async function load() {
      try {
        const profile = await apiCall('getUserProfile', {userId: userId});
        profileCache = profile;
        render(profile);
      } catch (err) {
        document.getElementById('loadError').textContent = err.message;
        document.getElementById('loadError').hidden = false;
      }
    }

    function render(profile) {
      const u = profile.user;
      document.title = u.name + ' — Dynamic Builders';
      document.getElementById('userTitle').textContent = u.name;
      document.getElementById('userSub').textContent = (ROLE_LABELS[u.role] || u.role) + ' · ' + u.email;

      document.getElementById('statStatus').innerHTML = '';
      document.getElementById('statStatus').appendChild(el('span', {class: 'status ' + u.status, text: nice(u.status)}));
      document.getElementById('statPlans').textContent = profile.stats.plans;
      document.getElementById('statReports').textContent = profile.stats.reports;
      document.getElementById('statTickets').textContent = profile.stats.ticketsRaised;

      const grid = document.getElementById('userInfoGrid');
      grid.innerHTML = '';
      function item(label, value) {
        grid.appendChild(el('div', {class: 'info-item'}, [el('div', {class: 'label', text: label}), el('div', {class: 'val', text: value || '—'})]));
      }
      item('Full name', u.name);
      item('Email', u.email);
      item('Role', ROLE_LABELS[u.role] || u.role);
      item('Phone', u.phone);
      item('Title', u.title);
      item('Address', u.address);
      item('Emergency contact', u.emergency_contact);
      item('Status', cap(u.status));
      item('Account created', u.created_at ? fmtDate(u.created_at) : '—');
      item('Last activity', profile.stats.lastActivity ? fmtDate(profile.stats.lastActivity) : 'No plans or reports yet');

      // Status actions + Edit/KPI buttons — IT Admin only, and never against your own account.
      const isSelf = u.id === session.userId;
      const statusActions = document.getElementById('statusActions');
      statusActions.innerHTML = '';
      if (isItAdmin && !isSelf) {
        statusActions.appendChild(u.status === 'active'
          ? el('button', {class: 'small secondary', text: 'Suspend', onclick: function () {setStatus(u, 'suspended');}})
          : el('button', {class: 'small secondary', text: 'Activate', onclick: function () {setStatus(u, 'active');}}));
        statusActions.appendChild(el('button', {class: 'small danger', text: 'Delete', onclick: function () {deleteUser(u);}}));
      }
      document.getElementById('editBtn').hidden = !isItAdmin;
      document.getElementById('editBtn').onclick = function () {editUser(u);};

      document.getElementById('printBtn').hidden = !isItAdmin;
      document.getElementById('printBtn').onclick = function () {printUserDetails(u);};

      // Every role has a KPI page now, not just Site Supervisors — most of its
      // figures (work plans/reports/follow-through) will simply read as zero
      // for a role that doesn't submit those, which is accurate, not broken.
      document.getElementById('kpiBtn').hidden = false;
      document.getElementById('kpiBtn').onclick = function () {window.location.href = 'kpi.html?userId=' + encodeURIComponent(u.id);};

      const projectsPanel = document.getElementById('projectsPanel');
      const projBody = document.getElementById('projectsBody');
      projBody.innerHTML = '';
      if (profile.assignedProjects && profile.assignedProjects.length) {
        projectsPanel.hidden = false;
        profile.assignedProjects.forEach(function (a) {
          projBody.appendChild(el('tr', {}, [
            el('td', {}, [a.project ? projectLink(a.project.id, a.project.name) : document.createTextNode(a.project_id || '—')]),
            el('td', {text: fmtDate(a.assigned_at)}),
            el('td', {}, [el('span', {class: 'status ' + a.status, text: nice(a.status)})])
          ]));
        });
      } else {
        projectsPanel.hidden = true;
      }

      const evalPanel = document.getElementById('evaluationsPanel');
      const evalBody = document.getElementById('evaluationsBody');
      evalBody.innerHTML = '';
      if (profile.evaluations && profile.evaluations.length) {
        evalPanel.hidden = false;
        profile.evaluations.forEach(function (ev) {
          evalBody.appendChild(el('tr', {}, [el('td', {text: ev.score}), el('td', {text: ev.notes || '—'})]));
        });
      } else {
        evalPanel.hidden = true;
      }

      document.getElementById('statGrid').hidden = false;
      document.getElementById('detailsPanel').hidden = false;
    }

    async function editUser(u) {
      const values = await uiForm({
        title: 'Edit user',
        message: u.email,
        okText: 'Save changes',
        fields: [
          {key: 'name', label: 'Name', value: u.name},
          {key: 'email', label: 'Email', type: 'email', value: u.email},
          {key: 'role', label: 'Role', type: 'select', value: u.role, options: ROLE_OPTIONS},
          {key: 'phone', label: 'Phone', required: false, value: u.phone || ''},
          {key: 'password', label: 'New password', type: 'password', required: false, optionalLabel: 'leave blank to keep current'}
        ]
      });
      if (!values) return;
      try {
        const fields = {name: values.name, email: values.email, role: values.role, phone: values.phone};
        if (values.password) fields.password = values.password;
        await apiCall('updateUser', Object.assign({userId: u.id}, fields));
        load();
        if (values.password && await uiConfirm('Password reset. Print a new credentials slip for ' + values.name + ' now?', {title: 'Print credentials?', okText: 'Print'})) {
          printUserCredentials(values);
        }
      } catch (err) {
        await uiAlert(err.message, {title: 'Could not save changes', danger: true});
      }
    }

    // ---------- printable documents ----------
    //
    // Same pattern used on project.html/it-admin.html: build into #printArea
    // (hidden on screen, shown only by the @media print rule in style.css) and
    // call window.print(). printUserCredentials is only ever reachable right
    // after a password is set (create or reset) — the plaintext password isn't
    // retrievable afterwards. printUserDetails has no password field at all.

    function printHead(kind) {
      return el('div', {class: 'print-head'}, [
        el('h1', {text: 'Dynamic Builders'}),
        el('p', {text: kind})
      ]);
    }

    function printFieldTable(pairs) {
      const rows = [];
      for (let i = 0; i < pairs.length; i += 2) {
        const a = pairs[i], b = pairs[i + 1];
        const cells = [el('td', {class: 'pf-label', text: a[0]}), el('td', {text: a[1] || '—'})];
        if (b) cells.push(el('td', {class: 'pf-label', text: b[0]}), el('td', {text: b[1] || '—'}));
        else cells.push(el('td', {class: 'pf-label'}), el('td', {}));
        rows.push(el('tr', {}, cells));
      }
      return el('table', {class: 'print-field-table'}, [el('tbody', {}, rows)]);
    }

    function doPrint(docEl) {
      const area = document.getElementById('printArea');
      area.innerHTML = '';
      area.appendChild(el('div', {class: 'print-doc'}, [docEl]));
      document.body.classList.add('printing');
      window.print();
    }
    window.addEventListener('afterprint', function () {document.body.classList.remove('printing');});

    function printUserCredentials(u) {
      const doc = el('div', {}, [
        printHead('New account credentials'),
        printFieldTable([
          ['Name', u.name], ['Role', ROLE_LABELS[u.role] || u.role],
          ['Email (username)', u.email], ['Phone', u.phone || '—'],
          ['Temporary password', u.password]
        ]),
        el('p', {class: 'muted', text: 'Please change this password after your first login. Keep this slip private — destroy it once the password has been changed.'}),
        el('p', {class: 'muted', text: 'Issued: ' + new Date().toLocaleString()})
      ]);
      doPrint(doc);
    }

    function printUserDetails(u) {
      const doc = el('div', {}, [
        printHead('User account details'),
        printFieldTable([
          ['Name', u.name], ['Role', ROLE_LABELS[u.role] || u.role],
          ['Email', u.email], ['Phone', u.phone || '—'],
          ['Title', u.title || '—'], ['Status', nice(u.status)],
          ['Address', u.address || '—'], ['Emergency contact', u.emergency_contact || '—'],
          ['User ID', u.id], ['Account created', u.created_at ? fmtDate(u.created_at) : '—']
        ]),
        el('p', {class: 'muted', text: 'Printed: ' + new Date().toLocaleString() + ' by ' + session.name})
      ]);
      doPrint(doc);
    }

    async function setStatus(u, status) {
      const verb = status === 'suspended' ? 'suspend' : 're-activate';
      if (!await uiConfirm('Really ' + verb + ' ' + u.name + '?', {title: verb === 'suspend' ? 'Suspend user?' : 'Re-activate user?', danger: verb === 'suspend', okText: verb === 'suspend' ? 'Suspend' : 'Activate'})) return;
      try {
        await apiCall('updateUser', {userId: u.id, status: status});
        load();
      } catch (err) {
        await uiAlert(err.message, {title: 'Something went wrong', danger: true});
      }
    }

    async function deleteUser(u) {
      if (!await uiConfirm('Permanently delete ' + u.name + ' (' + u.email + ')? This can\'t be undone.', {title: 'Delete user?', danger: true, okText: 'Delete'})) return;
      try {
        await apiCall('deleteUser', {userId: u.id});
        window.location.href = ROLE_PAGES[session.role] || 'index.html';
      } catch (err) {
        await uiAlert(err.message, {title: 'Something went wrong', danger: true});
      }
    }

    load();
  </script>
</body>

</html>
