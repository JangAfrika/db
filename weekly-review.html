<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Review — Dynamic Builders</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a2e">
<script src="ga.js"></script>
<script src="pwa.js"></script>
</head>
<body>
<header class="topbar">
  <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
  <div class="topbar-title">
    <h1 id="reviewTitle">Loading weekly review…</h1>
    <p class="muted" id="reviewSub"></p>
  </div>
  <div class="topbar-actions">
    <button class="secondary small" id="printBtn" hidden>Print</button>
    <div class="user-chip">
      <div class="avatar" id="whoAvatar"></div>
      <div class="meta"><div class="n" id="whoName"></div><div class="r" id="whoRole"></div></div>
    </div>
  </div>
</header>

<main>
  <p id="loadError" class="error" hidden></p>

  <section class="panel" id="detailsPanel" hidden>
    <div class="panel-head"><h2>Review details</h2></div>
    <div class="info-grid" id="reviewInfoGrid"></div>
    <h3 style="margin-top:18px">Summary</h3>
    <p id="reviewSummary" class="muted"></p>
  </section>
</main>

<div id="printArea"></div>

<script src="config.js"></script>
<script src="dialog.js"></script>
<script>
const session = requireSession();
if (typeof gaTrackRole === 'function') gaTrackRole(session.role);
document.getElementById('whoName').textContent = session.name;
document.getElementById('whoRole').textContent = ROLE_LABELS[session.role] || session.role;
document.getElementById('whoAvatar').textContent = (session.name || '?').split(' ').map(function (s) { return s[0]; }).join('').slice(0, 2).toUpperCase();
document.getElementById('backLink').href = backLinkHref(session);

const canSeeUsers = ['IT_ADMIN', 'MANAGER', 'ADMIN_SECRETARY'].indexOf(session.role) !== -1;
const params = new URLSearchParams(window.location.search);
const reviewId = params.get('id');

let reviewCache = null, siteCache = null, preparedByName = '—';

function userName(id, usersById) {
  if (!id) return '—';
  if (usersById[id]) return usersById[id].name;
  return id === session.userId ? session.name : '—';
}

async function init() {
  if (!reviewId) {
    document.getElementById('loadError').textContent = 'No weekly review specified.';
    document.getElementById('loadError').hidden = false;
    return;
  }
  try {
    const calls = [apiCall('getById', { table: 'WEEKLY_REVIEWS', id: reviewId })];
    if (canSeeUsers) calls.push(apiCall('list', { table: 'USERS' }));
    const results = await Promise.all(calls);
    const review = results[0];
    if (!review) throw new Error('No such weekly review.');
    reviewCache = review;
    const usersById = canSeeUsers ? byId(results[1]) : {};
    preparedByName = userName(review.prepared_by, usersById);

    siteCache = review.site_id ? await apiCall('getById', { table: 'SITES', id: review.site_id }).catch(function () { return null; }) : null;

    render();
    document.getElementById('printBtn').hidden = false;
  } catch (err) {
    document.getElementById('loadError').textContent = err.message;
    document.getElementById('loadError').hidden = false;
  }
}

function render() {
  const r = reviewCache;
  const siteName = siteCache ? siteCache.name : (r.site_id || '—');
  document.title = 'Weekly Review — ' + siteName + ' — Dynamic Builders';
  document.getElementById('reviewTitle').textContent = 'Weekly Review — ' + fmtDate(r.week_start) + ' to ' + fmtDate(r.week_end);
  document.getElementById('reviewSub').textContent = siteName;

  const grid = document.getElementById('reviewInfoGrid');
  grid.innerHTML = '';
  function item(label, value) {
    grid.appendChild(el('div', { class: 'info-item' }, [el('div', { class: 'label', text: label }), el('div', { class: 'val', text: value || '—' })]));
  }
  item('Site', siteName);
  item('Week start', fmtDate(r.week_start));
  item('Week end', fmtDate(r.week_end));
  item('Prepared by', preparedByName);

  document.getElementById('reviewSummary').textContent = r.summary || 'No summary recorded.';
  document.getElementById('detailsPanel').hidden = false;
}

function doPrint(docEl) {
  const area = document.getElementById('printArea');
  area.innerHTML = '';
  area.appendChild(el('div', { class: 'print-doc' }, [docEl]));
  document.body.classList.add('printing');
  window.print();
}
window.addEventListener('afterprint', function () { document.body.classList.remove('printing'); });

document.getElementById('printBtn').addEventListener('click', function () {
  if (!reviewCache) return;
  const r = reviewCache;
  const siteName = siteCache ? siteCache.name : (r.site_id || '—');
  const doc = el('div', {}, [
    el('div', { class: 'print-head' }, [el('h1', { text: 'Dynamic Builders' }), el('p', { text: 'Weekly Review' })]),
    el('table', { class: 'print-field-table' }, [el('tbody', {}, [
      el('tr', {}, [el('td', { class: 'pf-label', text: 'Site' }), el('td', { text: siteName }), el('td', { class: 'pf-label', text: 'Prepared by' }), el('td', { text: preparedByName })]),
      el('tr', {}, [el('td', { class: 'pf-label', text: 'Week start' }), el('td', { text: fmtDate(r.week_start) }), el('td', { class: 'pf-label', text: 'Week end' }), el('td', { text: fmtDate(r.week_end) })])
    ])]),
    el('h2', { text: 'Summary' }),
    el('p', { text: r.summary || 'No summary recorded.' })
  ]);
  doPrint(doc);
});

init();
</script>
</body>
</html>
