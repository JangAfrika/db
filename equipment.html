<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a2e">
<script src="ga.js"></script>
<script src="pwa.js"></script>
</head>
<body>
<header class="topbar">
  <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
  <div class="topbar-title">
    <h1>🛠️ Equipment</h1>
    <p class="muted">The equipment catalogue</p>
  </div>
  <div class="topbar-actions">
    <div class="user-chip">
      <div class="avatar" id="whoAvatar"></div>
      <div class="meta"><div class="n" id="whoName"></div><div class="r" id="whoRole"></div></div>
    </div>
  </div>
</header>

<main>
  <p id="loadError" class="error" hidden></p>

  <section class="panel" id="equipmentPanel">
    <div class="panel-head"><h2>Equipment</h2><button class="small" id="addResourcesBtn" hidden>+ RESOURCES</button></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Name</th><th>Type</th></tr></thead>
      <tbody id="equipmentBody"></tbody>
    </table></div>
  </section>

  <!-- Not a tab: hidden by default, shown as a popup (uiHostDialog) by the
       "+ RESOURCES" button above. Same shared add-resource form as
       materials.html / productivity-targets.html — see setupResourceForm()
       in config.js. -->
  <section id="resourceSection" hidden>
    <div class="panel-head"><h2>Add a resource</h2></div>
    <form id="resourceInnerForm">
      <label>Type
        <select id="res_type">
          <option value="material">Material</option>
          <option value="equipment">Equipment</option>
          <option value="target">Productivity target</option>
        </select>
      </label>
      <div id="res_fields_material" hidden>
        <label>Name<input id="res_m_name"></label>
        <label>Unit<input id="res_m_unit" placeholder="bags, m³, kg…"></label>
      </div>
      <div id="res_fields_equipment">
        <label>Name<input id="res_e_name"></label>
        <label>Type<input id="res_e_type" placeholder="excavator, mixer, generator…"></label>
      </div>
      <div id="res_fields_target" hidden>
        <label>Site<select id="res_t_site"></select></label>
        <label>Trade<input id="res_t_trade" placeholder="masonry, tiling, painting…"></label>
        <label>Unit<input id="res_t_unit" placeholder="m², units…"></label>
        <label>Daily target<input id="res_t_daily_target" type="number"></label>
      </div>
      <div style="margin-top:18px"><button type="submit">Add</button></div>
      <p id="resourceError" class="error" hidden></p>
      <p id="resourceSuccess" class="error" style="background:var(--good-bg);color:var(--good)" hidden></p>
    </form>
  </section>
</main>

<script src="config.js"></script>
<script src="dialog.js"></script>
<script>
const session = requireSession();
if (typeof gaTrackRole === 'function') gaTrackRole(session.role);
document.getElementById('whoName').textContent = session.name;
document.getElementById('whoRole').textContent = ROLE_LABELS[session.role] || session.role;
document.getElementById('whoAvatar').textContent = (session.name || '?').split(' ').map(function (s) { return s[0]; }).join('').slice(0, 2).toUpperCase();
document.getElementById('backLink').href = backLinkHref(session);

const canManage = ['IT_ADMIN', 'MANAGER', 'ADMIN_SECRETARY'].indexOf(session.role) !== -1;
if (canManage) document.getElementById('addResourcesBtn').hidden = false;

async function loadEquipment() {
  const equipment = await apiCall('list', { table: 'EQUIPMENT' });
  const body = document.getElementById('equipmentBody');
  body.innerHTML = '';
  if (!equipment.length) { body.appendChild(el('tr', {}, [el('td', { colspan: '2', class: 'empty', text: 'No equipment catalogued yet.' })])); return; }
  equipment.forEach(function (eq) {
    body.appendChild(el('tr', {}, [el('td', { text: eq.name }), el('td', { text: eq.type })]));
  });
}

let resourceDialog = null;

if (canManage) {
  setupResourceForm([], function (type) {
    if (type === 'equipment') loadEquipment();
    if (resourceDialog) setTimeout(function () { if (resourceDialog) resourceDialog.close(); }, 1200);
  });
  document.getElementById('res_type').value = 'equipment';

  document.getElementById('addResourcesBtn').addEventListener('click', function () {
    document.getElementById('resourceError').hidden = true;
    document.getElementById('resourceSuccess').hidden = true;
    document.getElementById('res_type').value = 'equipment';
    document.getElementById('res_fields_material').hidden = true;
    document.getElementById('res_fields_equipment').hidden = false;
    document.getElementById('res_fields_target').hidden = true;
    resourceDialog = uiHostDialog(document.getElementById('resourceSection'), {
      title: 'Add a resource',
      onClose: function () { resourceDialog = null; }
    });
  });
}

async function init() {
  try {
    await loadEquipment();
  } catch (err) {
    document.getElementById('loadError').textContent = err.message;
    document.getElementById('loadError').hidden = false;
  }
}

init();
</script>
</body>
</html>
