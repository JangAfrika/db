<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Work Plan — Dynamic Builders</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a2e">
<script src="ga.js"></script>
<script src="pwa.js"></script>
</head>
<body>
<header class="topbar">
  <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
  <div class="topbar-title">
    <h1 id="planTitle">Loading work plan…</h1>
    <p class="muted" id="planSub"></p>
  </div>
  <div class="topbar-actions">
    <button class="secondary small" id="printBtn" hidden>Print</button>
    <div class="user-chip">
      <div class="avatar" id="whoAvatar"></div>
      <div class="meta"><div class="n" id="whoName"></div><div class="r" id="whoRole"></div></div>
    </div>
  </div>
</header>

<main>
  <p id="loadError" class="error" hidden></p>

  <section class="stat-grid" id="statGrid" hidden>
    <div class="stat-card"><div class="label">Status</div><div class="value" id="statStatus">—</div></div>
    <div class="stat-card"><div class="label">Workforce</div><div class="value" id="statWorkforce">—</div></div>
    <div class="stat-card"><div class="label">Weather</div><div class="value" id="statWeather">—</div></div>
    <div class="stat-card"><div class="label">Planned tasks</div><div class="value" id="statTasks">—</div></div>
  </section>

  <section class="panel" id="detailsPanel" hidden>
    <div class="panel-head"><h2>Plan details</h2></div>
    <div class="info-grid" id="planInfoGrid"></div>
    <p class="muted" id="planNotes" style="margin-top:14px"></p>
  </section>

  <section class="panel" id="tasksPanel" hidden>
    <div class="panel-head"><h2>Planned activities</h2></div>
    <div class="table-scroll"><table>
      <thead><tr><th>#</th><th>Activity</th><th>Work area</th><th>Responsible team</th><th>Manpower</th><th>Materials/equipment</th><th>Daily target</th><th>Status</th></tr></thead>
      <tbody id="tasksBody"></tbody>
    </table></div>
  </section>
</main>

<div id="printArea"></div>

<script src="config.js"></script>
<script src="dialog.js"></script>
<script>
const session = requireSession();
if (typeof gaTrackRole === 'function') gaTrackRole(session.role);
document.getElementById('whoName').textContent = session.name;
document.getElementById('whoRole').textContent = ROLE_LABELS[session.role] || session.role;
document.getElementById('whoAvatar').textContent = (session.name || '?').split(' ').map(function (s) { return s[0]; }).join('').slice(0, 2).toUpperCase();
document.getElementById('backLink').href = backLinkHref(session);

const WEATHER_LABELS = { clear: 'Clear', cloudy: 'Cloudy', rain: 'Rain', storm: 'Storm', extreme_heat: 'Extreme heat' };
const canSeeUsers = ['IT_ADMIN', 'MANAGER', 'ADMIN_SECRETARY'].indexOf(session.role) !== -1;

const params = new URLSearchParams(window.location.search);
const planId = params.get('id');

let usersById = {}, projectCache = null, siteName = '—', planCache = null, tasksCache = [];

function nice(s) { return s ? String(s).replace(/_/g, ' ') : ''; }
function cap(s) { s = nice(s); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function userName(id) {
  if (!id) return '—';
  if (usersById[id]) return usersById[id].name;
  return id === session.userId ? session.name : '—';
}

async function init() {
  if (!planId) {
    document.getElementById('loadError').textContent = 'No work plan specified.';
    document.getElementById('loadError').hidden = false;
    return;
  }
  try {
    const calls = [apiCall('getWorkPlanDetail', { planId: planId })];
    if (canSeeUsers) calls.push(apiCall('list', { table: 'USERS' }));
    const results = await Promise.all(calls);
    const detail = results[0];
    if (canSeeUsers) usersById = byId(results[1]);
    planCache = detail.plan;
    tasksCache = detail.tasks;

    const [project, site] = await Promise.all([
      planCache.project_id ? apiCall('getById', { table: 'PROJECTS', id: planCache.project_id }).catch(function () { return null; }) : null,
      planCache.site_id ? apiCall('getById', { table: 'SITES', id: planCache.site_id }).catch(function () { return null; }) : null
    ]);
    projectCache = project;
    siteName = site ? site.name : (planCache.site_id || '—');

    render(detail);
    document.getElementById('printBtn').hidden = false;
  } catch (err) {
    document.getElementById('loadError').textContent = err.message;
    document.getElementById('loadError').hidden = false;
  }
}

function render(detail) {
  const p = detail.plan;
  document.title = 'Daily Work Plan — ' + fmtDate(p.plan_date) + ' — Dynamic Builders';
  document.getElementById('planTitle').textContent = 'Daily Work Plan — ' + fmtDate(p.plan_date);
  document.getElementById('planSub').textContent = (projectCache ? projectCache.name : 'No project') + ' · ' + siteName;

  document.getElementById('statStatus').innerHTML = '';
  document.getElementById('statStatus').appendChild(el('span', { class: 'status ' + p.status, text: nice(p.status) }));
  document.getElementById('statWorkforce').textContent = p.total_workforce || '—';
  document.getElementById('statWeather').textContent = WEATHER_LABELS[p.weather] || p.weather || '—';
  document.getElementById('statTasks').textContent = detail.tasks.length;

  const grid = document.getElementById('planInfoGrid');
  grid.innerHTML = '';
  function item(label, value) {
    grid.appendChild(el('div', { class: 'info-item' }, [
      el('div', { class: 'label', text: label }),
      el('div', { class: 'val', text: value || '—' })
    ]));
  }
  item('Project', projectCache ? projectCache.name : '—');
  item('Site', siteName);
  item('Supervisor', userName(p.supervisor_id));
  item('Skilled / Labourers / Subs', [p.skilled_workers, p.labourers, p.subcontractors].filter(Boolean).join(' / ') || '—');
  item('Toolbox talk', p.toolbox_talk ? 'Yes' : 'No');
  item('PPE check', p.ppe_check ? 'Yes' : 'No');
  item('Target', p.target || '—');

  document.getElementById('planNotes').textContent = p.site_notes ? ('Site notes: ' + p.site_notes) : '';

  const body = document.getElementById('tasksBody');
  body.innerHTML = '';
  if (!detail.tasks.length) {
    body.appendChild(el('tr', {}, [el('td', { colspan: '8', class: 'empty', text: 'No planned activities recorded.' })]));
  } else {
    detail.tasks.forEach(function (t) {
      body.appendChild(el('tr', {}, [
        el('td', { text: String(t.seq || '') }),
        el('td', { text: t.activity || '' }),
        el('td', { text: t.work_area || '' }),
        el('td', { text: t.responsible_team || '' }),
        el('td', { text: t.manpower || '' }),
        el('td', { text: t.materials_equipment || '' }),
        el('td', { text: t.daily_target || '' }),
        el('td', { text: t.status || '' })
      ]));
    });
  }

  document.getElementById('statGrid').hidden = false;
  document.getElementById('detailsPanel').hidden = false;
  document.getElementById('tasksPanel').hidden = false;
}

// ---------- printable document — same bordered field-table + sign-off
// layout used across the app's printable plans and reports ----------

function printHead(kind) {
  return el('div', { class: 'print-head' }, [
    el('h1', { text: 'Dynamic Builders' }),
    el('p', { text: kind })
  ]);
}

function printFieldTable(pairs) {
  const rows = [];
  for (let i = 0; i < pairs.length; i += 2) {
    const a = pairs[i], b = pairs[i + 1];
    const cells = [el('td', { class: 'pf-label', text: a[0] }), el('td', { text: a[1] || '—' })];
    if (b) { cells.push(el('td', { class: 'pf-label', text: b[0] }), el('td', { text: b[1] || '—' })); }
    else { cells.push(el('td', { class: 'pf-label' }), el('td', {})); }
    rows.push(el('tr', {}, cells));
  }
  return el('table', { class: 'print-field-table' }, [el('tbody', {}, rows)]);
}

function printTable(headers, rows) {
  if (!rows.length) return el('p', { class: 'muted', text: 'None recorded.' });
  return el('table', {}, [
    el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }))]),
    el('tbody', {}, rows)
  ]);
}

function signOffTable(reporterName) {
  return el('table', { class: 'print-signoff' }, [
    el('thead', {}, [el('tr', {}, [
      el('th', { text: 'Prepared by / Site Supervisor' }),
      el('th', { text: 'Project Manager' }),
      el('th', { text: 'Client / Consultant' })
    ])]),
    el('tbody', {}, [el('tr', {}, [
      el('td', { text: 'Name/Sign: ' + (reporterName || '') + '  _________________' }),
      el('td', { text: 'Name/Sign: _________________' }),
      el('td', { text: 'Name/Sign: _________________' })
    ])])
  ]);
}

function doPrint(docEl) {
  const area = document.getElementById('printArea');
  area.innerHTML = '';
  area.appendChild(el('div', { class: 'print-doc' }, [docEl]));
  document.body.classList.add('printing');
  window.print();
}
window.addEventListener('afterprint', function () { document.body.classList.remove('printing'); });

function printPlan() {
  if (!planCache) return;
  const p = planCache;
  const doc = el('div', {}, [
    printHead('Daily Work Plan'),
    printFieldTable([
      ['Project Name', projectCache ? projectCache.name : '—'], ['Plan Date', fmtDate(p.plan_date)],
      ['Site Location', siteName], ['Site Supervisor', userName(p.supervisor_id)],
      ['Weather', WEATHER_LABELS[p.weather] || p.weather], ['Total workforce', p.total_workforce]
    ]),
    el('h2', { text: '1. Manpower / readiness' }),
    printFieldTable([
      ['Skilled / Labourers / Subs', [p.skilled_workers, p.labourers, p.subcontractors].filter(Boolean).join(' / ')],
      ['Toolbox talk / PPE check', (p.toolbox_talk ? 'Toolbox ✓' : 'Toolbox —') + '  PPE: ' + (p.ppe_check ? '✓' : '—')]
    ]),
    el('h2', { text: '2. Planned activities' }),
    printTable(['#', 'Activity', 'Work area', 'Team', 'Manpower', 'Materials/equipment', 'Target'],
      tasksCache.map(function (t) {
        return el('tr', {}, [
          el('td', { text: String(t.seq || '') }),
          el('td', { text: t.activity || '' }),
          el('td', { text: t.work_area || '' }),
          el('td', { text: t.responsible_team || '' }),
          el('td', { text: t.manpower || '' }),
          el('td', { text: t.materials_equipment || '' }),
          el('td', { text: t.daily_target || '' })
        ]);
      })),
    p.target ? el('p', {}, [el('strong', { text: 'Target: ' }), document.createTextNode(p.target)]) : el('span'),
    p.site_notes ? el('p', {}, [el('strong', { text: 'Site notes: ' }), document.createTextNode(p.site_notes)]) : el('span'),
    signOffTable(userName(p.supervisor_id))
  ]);
  doPrint(doc);
}

document.getElementById('printBtn').addEventListener('click', function () {
  try {
    printPlan();
  } catch (err) {
    uiAlert(err.message, { title: 'Could not print', danger: true });
  }
});

init();
</script>
</body>
</html>
