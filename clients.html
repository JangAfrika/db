<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients &amp; consultants</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a2e">
<script src="ga.js"></script>
<script src="pwa.js"></script>
</head>
<body>
<header class="topbar">
  <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
  <div class="topbar-title">
    <h1>Clients &amp; consultants</h1>
    <p class="muted">Everyone a site is being built for or supervised by</p>
  </div>
  <div class="topbar-actions">
    <div class="user-chip">
      <div class="avatar" id="whoAvatar"></div>
      <div class="meta"><div class="n" id="whoName"></div><div class="r" id="whoRole"></div></div>
    </div>
  </div>
</header>

<main>
  <p id="loadError" class="error" hidden></p>

  <section class="panel" id="clientsPanel">
    <div class="panel-head"><h2>All clients &amp; consultants</h2><button class="small" id="addClientBtn" hidden>+ Add client/consultant</button></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Name</th><th>Type</th><th>Contact person</th><th>Phone</th><th>Email</th><th>Sites</th></tr></thead>
      <tbody id="clientsBody"></tbody>
    </table></div>
  </section>
</main>

<script src="config.js"></script>
<script src="dialog.js"></script>
<script>
const session = requireSession();
if (typeof gaTrackRole === 'function') gaTrackRole(session.role);
document.getElementById('whoName').textContent = session.name;
document.getElementById('whoRole').textContent = ROLE_LABELS[session.role] || session.role;
document.getElementById('whoAvatar').textContent = (session.name || '?').split(' ').map(function (s) { return s[0]; }).join('').slice(0, 2).toUpperCase();
document.getElementById('backLink').href = backLinkHref(session);

const canManage = ['IT_ADMIN', 'MANAGER', 'ADMIN_SECRETARY'].indexOf(session.role) !== -1;
if (canManage) document.getElementById('addClientBtn').hidden = false;

function cap(s) { return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : ''; }

async function loadClients() {
  try {
    const [clients, sites] = await Promise.all([
      apiCall('list', { table: 'CLIENTS' }),
      apiCall('list', { table: 'SITES' })
    ]);
    const siteCountByClient = {};
    sites.forEach(function (s) { if (s.client_id) siteCountByClient[s.client_id] = (siteCountByClient[s.client_id] || 0) + 1; });

    const body = document.getElementById('clientsBody');
    body.innerHTML = '';
    if (!clients.length) {
      body.appendChild(el('tr', {}, [el('td', { colspan: '6', class: 'empty', text: 'No clients or consultants recorded yet.' })]));
      return;
    }
    clients.forEach(function (c) {
      body.appendChild(el('tr', {}, [
        el('td', {}, [clientLink(c.id, c.name)]),
        el('td', { text: cap(c.type) || '—' }),
        el('td', { text: c.contact_name || '—' }),
        el('td', { text: c.phone || '—' }),
        el('td', { text: c.email || '—' }),
        el('td', { text: String(siteCountByClient[c.id] || 0) })
      ]));
    });
  } catch (err) {
    document.getElementById('loadError').textContent = err.message;
    document.getElementById('loadError').hidden = false;
  }
}

if (canManage) {
  document.getElementById('addClientBtn').addEventListener('click', async function () {
    const created = await addClientFlow(session);
    if (created) loadClients();
  });
}

loadClients();
</script>
</body>
</html>
