<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile — Dynamic Builders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo">DB</span>
      <span class="name">Dynamic Builders<span class="role" id="roleLabel"></span></span>
    </div>
    <a class="nav-item" id="backLink" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Back to dashboard</a>
    <div class="sidebar-foot">
      <button class="nav-item" onclick="reportIssue()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>Report an issue</button>
      <button class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log out</button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="hamburger-btn" id="sidebarToggle" aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">
        <h1>My profile</h1>
        <p class="muted">Your personal details, role, and reporting line</p>
      </div>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="avatar" id="whoAvatar"></div>
          <div class="meta"><div class="n" id="whoName"></div><div class="r" id="whoRole"></div></div>
        </div>
      </div>
    </header>

    <main>
      <section class="panel" id="details">
        <div class="panel-head">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Details</h2>
          <button class="small" id="toggleEdit">Edit my details</button>
        </div>

        <div class="info-grid" id="infoGrid"></div>

        <div class="form-wrap" id="editWrap" style="margin-top:20px">
          <form id="profileForm" class="inline">
            <label class="grow">Phone<input id="pr_phone"></label>
            <label style="flex-basis:100%">Address<input id="pr_address"></label>
            <label style="flex-basis:100%">Emergency contact<input id="pr_emergency" placeholder="Name — phone number"></label>
            <button type="submit">Save changes</button>
          </form>
          <p class="muted">Name, role, title and reporting line are set by IT admin — reach out to them if any of those need to change.</p>
          <p id="profileError" class="error" hidden></p>
        </div>
      </section>

      <section class="panel" id="security">
        <div class="panel-head">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Password</h2>
          <button class="small" id="toggleChangePassword">Change password</button>
        </div>
        <div class="form-wrap" id="changePasswordWrap">
          <form id="changePasswordForm" class="inline">
            <label class="grow">Current password<input id="cp_current" type="password" required autocomplete="current-password"></label>
            <label class="grow">New password<input id="cp_new" type="password" required minlength="6" autocomplete="new-password"></label>
            <label class="grow">Confirm new password<input id="cp_confirm" type="password" required minlength="6" autocomplete="new-password"></label>
            <button type="submit">Update password</button>
          </form>
          <p class="muted">At least 6 characters.</p>
          <p id="changePasswordError" class="error" hidden></p>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="config.js"></script>
<script>
const token = sessionStorage.getItem('token');
const role = sessionStorage.getItem('role');
if (!token) { window.location.href = 'index.html'; }

document.getElementById('whoName').textContent = sessionStorage.getItem('name') || '';
document.getElementById('whoRole').textContent = ROLE_LABELS[role] || role || '';
document.getElementById('roleLabel').textContent = ROLE_LABELS[role] || role || '';
document.getElementById('whoAvatar').textContent = (sessionStorage.getItem('name') || '?').split(' ').map(function (s) { return s[0]; }).join('').slice(0, 2).toUpperCase();
document.getElementById('backLink').href = ROLE_PAGES[role] || 'index.html';
setupMobileSidebar();

const editToggle = setupFormToggle(document.getElementById('toggleEdit'), document.getElementById('editWrap'), 'Edit my details');
const changePasswordToggle = setupFormToggle(document.getElementById('toggleChangePassword'), document.getElementById('changePasswordWrap'), 'Change password');

guardSubmit(document.getElementById('changePasswordForm'), async function (reqId) {
  const errorEl = document.getElementById('changePasswordError');
  errorEl.hidden = true;
  const newPw = document.getElementById('cp_new').value;
  const confirmPw = document.getElementById('cp_confirm').value;
  try {
    if (newPw !== confirmPw) throw new Error("New password and confirmation don't match.");
    await apiCall('changeOwnPassword', {
      currentPassword: document.getElementById('cp_current').value,
      newPassword: newPw
    }, reqId);
    document.getElementById('changePasswordForm').reset();
    changePasswordToggle.close();
    alert('Password updated.');
  } catch (err) {
    showError(errorEl, err);
  }
});

function info(label, value) {
  return el('div', { class: 'info-item' }, [
    el('div', { class: 'label', text: label }),
    el('div', { class: 'val', text: value || '—' })
  ]);
}

async function loadProfile() {
  const p = await apiCall('getMyProfile', {});
  const grid = document.getElementById('infoGrid');
  grid.innerHTML = '';
  grid.appendChild(info('Name', p.name));
  grid.appendChild(info('Email', p.email));
  grid.appendChild(info('Role', ROLE_LABELS[p.role] || p.role));
  grid.appendChild(info('Job title', p.title));
  grid.appendChild(info('Reports to', p.reports_to_name));
  grid.appendChild(info('Phone', p.phone));
  grid.appendChild(info('Address', p.address));
  grid.appendChild(info('Emergency contact', p.emergency_contact));
  grid.appendChild(info('Account status', p.status));
  grid.appendChild(info('Member since', fmtDate(p.created_at)));

  document.getElementById('pr_phone').value = p.phone || '';
  document.getElementById('pr_address').value = p.address || '';
  document.getElementById('pr_emergency').value = p.emergency_contact || '';
}

guardSubmit(document.getElementById('profileForm'), async function (reqId) {
  const errorEl = document.getElementById('profileError');
  errorEl.hidden = true;
  try {
    await apiCall('updateOwnProfile', {
      phone: document.getElementById('pr_phone').value.trim(),
      address: document.getElementById('pr_address').value.trim(),
      emergency_contact: document.getElementById('pr_emergency').value.trim()
    }, reqId);
    editToggle.close();
    loadProfile();
  } catch (err) {
    showError(errorEl, err);
  }
});

loadProfile();
</script>
</body>
</html>
