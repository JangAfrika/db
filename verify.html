<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify email</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a2e">
<script src="ga.js"></script>
<script src="pwa.js"></script>
</head>
<body class="centered">
<div class="card">
  <div class="brand-mark"><img class="logo" src="logo.png" alt="Dynamic Builders logo"> <strong>Dynamic Builders</strong></div>

  <div id="working" style="margin-top:14px">
    <p class="muted">Verifying your email…</p>
  </div>

  <div id="okState" hidden style="margin-top:14px">
    <p>✅ Email verified for <strong id="okName"></strong>.</p>
    <p class="muted" style="margin-top:8px">You can log in now — you'll see your own profile until an IT admin reviews your account and assigns you a role. They'll email you when that's done.</p>
    <a class="btn-link" href="index.html" style="display:block; margin-top:16px; text-align:center">Log in</a>
  </div>

  <div id="failState" hidden style="margin-top:14px">
    <p class="error" id="failMessage"></p>
    <label style="margin-top:12px">Email address
      <input type="email" id="resendEmail" autocomplete="username">
    </label>
    <button type="button" id="resendBtn" style="width:100%; margin-top:8px">Resend verification email</button>
    <a class="btn-link" href="index.html" style="display:block; margin-top:14px; text-align:center">Back to login</a>
  </div>
</div>

<script src="config.js"></script>
<script src="dialog.js"></script>
<script>
(async function () {
  const token = new URLSearchParams(window.location.search).get('token');
  const working = document.getElementById('working');
  const okState = document.getElementById('okState');
  const failState = document.getElementById('failState');

  if (!token) {
    working.hidden = true;
    failState.hidden = false;
    document.getElementById('failMessage').textContent = 'Missing or malformed verification link.';
    return;
  }

  try {
    const result = await apiCall('verifyEmail', { token: token });
    working.hidden = true;
    document.getElementById('okName').textContent = result.name;
    okState.hidden = false;
  } catch (err) {
    working.hidden = true;
    failState.hidden = false;
    document.getElementById('failMessage').textContent = err.message;
  }
})();

document.getElementById('resendBtn').addEventListener('click', async function () {
  const btn = this;
  const email = document.getElementById('resendEmail').value.trim();
  if (!email) return;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    await apiCall('resendVerification', { email: email });
    await uiAlert('If that address is awaiting verification, a new link is on its way — check your inbox (and spam folder).', { title: 'Verification email sent' });
  } catch (err) {
    await uiAlert(err.message, { title: 'Something went wrong', danger: true });
  } finally {
    btn.disabled = false;
    btn.textContent = 'Resend verification email';
  }
});
</script>
</body>
</html>
