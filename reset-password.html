<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — Dynamic Builders</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/logo.png">
<link rel="apple-touch-icon" href="icons/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a2e">
<script src="js/ga.js"></script>
<script src="js/pwa.js"></script>
</head>
<body class="centered">
<div id="working" class="card">
  <div class="brand-mark"><img class="logo" src="icons/logo.png" alt="Dynamic Builders logo"> <strong>Dynamic Builders</strong></div>
  <p class="muted" style="margin-top:14px">Checking your reset link…</p>
</div>

<form id="resetForm" class="card" hidden>
  <div class="brand-mark"><img class="logo" src="icons/logo.png" alt="Dynamic Builders logo"> <strong>Dynamic Builders</strong></div>
  <p class="muted" style="margin-bottom:20px">Choose a new password for <strong id="resetEmail"></strong>.</p>

  <label>New password
    <input type="password" id="n_password" required autocomplete="new-password" minlength="6">
  </label>
  <label>Confirm new password
    <input type="password" id="n_password2" required autocomplete="new-password" minlength="6">
  </label>
  <button type="submit" style="width:100%">Set new password</button>
  <p id="error" class="error" hidden></p>
</form>

<div id="okState" class="card" hidden>
  <div class="brand-mark"><img class="logo" src="icons/logo.png" alt="Dynamic Builders logo"> <strong>Dynamic Builders</strong></div>
  <p style="margin-top:14px">✅ Your password has been changed.</p>
  <p class="muted" style="margin-top:8px">You can log in with your new password now.</p>
  <a class="btn-link" href="index.html" style="display:block; margin-top:16px; text-align:center">Log in</a>
</div>

<div id="failState" class="card" hidden>
  <div class="brand-mark"><img class="logo" src="icons/logo.png" alt="Dynamic Builders logo"> <strong>Dynamic Builders</strong></div>
  <p class="error" id="failMessage" style="margin-top:14px"></p>
  <a class="btn-link" href="forgot-password.html" style="display:block; margin-top:16px; text-align:center">Request a new reset link</a>
  <a class="btn-link" href="index.html" style="display:block; margin-top:10px; text-align:center">Back to login</a>
</div>

<script src="js/config.js"></script>
<script src="js/dialog.js"></script>
<script>
const resetToken = new URLSearchParams(window.location.search).get('token');

function showState(id) {
  ['working', 'resetForm', 'okState', 'failState'].forEach(function (s) {
    document.getElementById(s).hidden = s !== id;
  });
}

function fail(message) {
  document.getElementById('failMessage').textContent = message;
  showState('failState');
}

(async function () {
  if (!resetToken) return fail('Missing or malformed reset link.');
  try {
    const result = await apiCall('checkPasswordResetToken', { token: resetToken });
    document.getElementById('resetEmail').textContent = result.email;
    showState('resetForm');
  } catch (err) {
    fail(err.message);
  }
})();

guardSubmit(document.getElementById('resetForm'), async function () {
  const errorEl = document.getElementById('error');
  errorEl.hidden = true;
  const password = document.getElementById('n_password').value;
  const password2 = document.getElementById('n_password2').value;
  if (password !== password2) {
    showError(errorEl, { message: 'Passwords don\'t match.' });
    return;
  }
  try {
    await apiCall('resetPassword', { token: resetToken, password: password });
    showState('okState');
  } catch (err) {
    showError(errorEl, err);
  }
});
</script>
</body>
</html>
