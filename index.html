<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Builders — Log in</title>
<link rel="stylesheet" href="style.css">
<script src="ga.js"></script>
</head>
<body class="centered">
<form id="loginForm" class="card">
  <div class="brand-mark"><span class="logo">DB</span> <strong>Dynamic Builders</strong></div>
  <p class="muted" style="margin-bottom:20px">Site reporting system</p>

  <label>Email
    <input type="email" id="email" required autocomplete="username">
  </label>
  <label>Password
    <input type="password" id="password" required autocomplete="current-password">
  </label>
  <button type="submit" style="width:100%">Log in</button>
  <p id="notice" class="muted" hidden style="margin-top:14px"></p>
  <p id="error" class="error" hidden></p>
  <p class="muted" style="margin-top:16px; text-align:center">New here? <a href="register.html">Create an account</a></p>
</form>

<script src="config.js"></script>
<script src="dialog.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  if (params.get('reason') === 'idle') {
    const noticeEl = document.getElementById('notice');
    noticeEl.textContent = 'Session Expired! Please log in again.';
    noticeEl.hidden = false;
  }
})();

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.hidden = true;

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const data = await apiCall('login', { email: email, password: password });
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('role', data.role);
    sessionStorage.setItem('name', data.name);
    sessionStorage.setItem('email', data.email);
    sessionStorage.setItem('userId', data.userId || '');
    // No role yet means the account is verified but still awaiting IT
    // Admin approval — send them to the profile-only pending page instead
    // of a role dashboard that doesn't exist for them yet.
    window.location.href = data.role ? (ROLE_PAGES[data.role] || 'index.html') : 'pending.html';
  } catch (err) {
    showError(errorEl, err);
  }
});
</script>
</body>
</html>
